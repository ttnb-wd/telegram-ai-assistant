name: Backup Memory

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:


jobs:

  backup:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"


    - name: Run backup
      run: |
        python backup.py


    - name: Upload backup
      uses: actions/upload-artifact@v4
      with:
        name: memory-backup
        path: backups/